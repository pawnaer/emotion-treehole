<style>
:root{--glass:rgba(255,255,255,0.18);--glass-border:rgba(255,255,255,0.35);--ink:#2a4a5a;--ink-dim:#5a7a8a;--ink-faint:#8aa8b5;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:"ZCOOL KuaiLe","Noto Sans SC",system-ui,sans-serif;color:var(--ink);position:relative;user-select:none;

.serif{font-family:"ZCOOL KuaiLe","Noto Serif SC",serif}
#scene{position:fixed;inset:0;z-index:1}
#glCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;pointer-events:none}
.glass-chip{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-border);border-radius:30px;padding:8px 16px;font-size:13px;letter-spacing:1px;color:var(--ink);display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(120,160,180,.15),inset 0 1px 0 rgba(255,255,255,.4)}
.brand{pointer-events:auto}
.brand .name{font-family:"Noto Serif SC",serif;font-size:16px;font-weight:600}
#beijingClock{position:fixed;top:24px;left:168px;z-index:20;font-family:"ZCOOL KuaiLe",serif;font-size:13px;color:#5a8a9a;letter-spacing:2px;opacity:.78;pointer-events:none}
.top-right{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.25s}

.balance-chip{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:30px;padding:6px 14px;font-size:12px;color:var(--ink-dim);letter-spacing:1px;box-shadow:0 4px 20px rgba(120,160,180,.12)}
.balance-chip .dot{width:8px;height:8px;border-radius:50%;background:#7ec850;box-shadow:0 0 8px #7ec850}
.balance-chip .num{color:var(--ink);font-weight:500}
.scene-chip{position:fixed;top:100px;left:50%;transform:translateX(-50%);z-index:18;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.2);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.32);color:var(--ink-dim);font-size:11px;letter-spacing:1px;transition:background .5s,color .5s;pointer-events:none}
body.night .scene-chip{color:rgba(235,247,255,.8);background:rgba(255,255,255,.08)}
.orb-hint{position:fixed;z-index:18;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;display:none;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(120,160,180,.2);animation:hp 3s ease-in-out infinite;transition:.3s}
.orb-hint:hover{transform:scale(1.05)}
.orb-hint .zi{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Noto Serif SC",serif;font-size:15px;font-weight:500;color:#fff}
@keyframes hp{0%,100%{box-shadow:0 4px 20px rgba(120,160,180,.2)}50%{box-shadow:0 4px 30px rgba(120,160,180,.4)}}
.chat-dock{position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:center;padding:0 16px 20px;transform:translateY(120%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.chat-dock.open{transform:translateY(0)}
.chat-box{width:min(560px,100%);background:var(--glass);backdrop-filter:blur(28px) saturate(1.5);-webkit-backdrop-filter:blur(28px) saturate(1.5);border:1px solid var(--glass-border);border-radius:24px;box-shadow:0 10px 40px rgba(80,120,150,.25),inset 0 1px 0 rgba(255,255,255,.5);overflow:hidden}

.msg{max-width:80%;padding:9px 14px;border-radius:18px;font-size:14px;line-height:1.65;animation:fu .3s;position:relative}

.msg.bot{align-self:flex-start;background:rgba(255,255,255,.35);color:var(--ink);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:rgba(120,200,220,.5);color:#1a3a4a;border-bottom-right-radius:6px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4)}

.chat-box textarea::placeholder{color:var(--ink-faint)}
.chat-box .send{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#fff,#e0f0f5);box-shadow:0 2px 10px rgba(100,150,180,.3);display:flex;align-items:center;justify-content:center;color:#4a8aaa;flex-shrink:0}
.chat-box .send svg{width:18px;height:18px}
.quick-prompts{display:flex;gap:8px;overflow-x:auto;padding:8px 14px 2px;scrollbar-width:none}

.quick-prompts button{white-space:nowrap;border:1px solid rgba(130,180,200,.35);background:rgba(255,255,255,.5);color:var(--ink-dim);border-radius:999px;padding:6px 10px;font:12px "Noto Sans SC",sans-serif;cursor:pointer}

.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.action-grid button,.action-card .wide-action{border:none;border-radius:10px;padding:9px 10px;background:rgba(126,192,208,.18);color:var(--ink);font:12px "Noto Sans SC",sans-serif;cursor:pointer;text-align:left}
.action-grid button:hover,.action-card .wide-action:hover{background:rgba(126,192,208,.35)}
.action-card .wide-action{width:100%;text-align:center;margin-top:8px;background:linear-gradient(135deg,#8ad0e0,#64bfc4);color:#fff}
.roulette-window{position:relative;height:190px;overflow:hidden;margin:14px 0 10px;border-radius:16px;border:1px solid rgba(126,192,208,.35);background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.68),rgba(255,255,255,.28))}
.roulette-window::before,.roulette-window::after{content:"";position:absolute;left:0;right:0;height:58px;z-index:3;pointer-events:none}
.roulette-window::before{top:0;background:linear-gradient(180deg,rgba(235,247,250,.96),rgba(235,247,250,0))}
.roulette-window::after{bottom:0;background:linear-gradient(0deg,rgba(235,247,250,.96),rgba(235,247,250,0))}
.roulette-focus{position:absolute;left:10px;right:10px;top:63px;height:64px;z-index:2;border:1px solid rgba(90,180,200,.55);border-radius:12px;background:rgba(126,200,220,.12);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset;pointer-events:none}
.roulette-focus::before,.roulette-focus::after{content:"";position:absolute;top:50%;width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;transform:translateY(-50%)}
.roulette-focus::before{left:-8px;border-left:9px solid #64bfc4}
.roulette-focus::after{right:-8px;border-right:9px solid #64bfc4}
.roulette-reel{transition:transform 2.8s cubic-bezier(.12,.72,.18,1)}
.roulette-item{height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 24px;font-size:13px;line-height:1.45;color:var(--ink);box-sizing:border-box}
.roulette-result{min-height:22px;text-align:center;font-size:13px;color:var(--ink-dim)}
.journal-list{display:flex;flex-direction:column;gap:8px;max-height:48vh;overflow-y:auto;padding-right:3px}

.journal-entry p{font-size:13px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.selfcare-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.selfcare-option{min-height:48px;border:1px solid rgba(126,192,208,.3);border-radius:12px;background:rgba(255,255,255,.48);color:var(--ink-dim);font:12px "Noto Sans SC",sans-serif;text-align:left;padding:9px 11px;cursor:pointer}

.trend-wrap{position:relative;background:rgba(255,255,255,.45);border:1px solid rgba(126,192,208,.28);border-radius:16px;padding:12px;margin:10px 0 14px}

.trend-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.trend-summary div{text-align:center;background:rgba(255,255,255,.5);border-radius:10px;padding:8px 4px}

.trend-summary span{font-size:10px;color:var(--ink-faint)}
.crisis-note{border:1px solid rgba(224,128,128,.5);background:rgba(255,240,240,.86);border-radius:14px;padding:14px;margin-top:10px;color:#7a3f3f;font-size:13px;line-height:1.8}
.crisis-note b{font-size:15px}
.practice-mask{position:fixed;inset:0;z-index:90;background:rgba(16,36,54,.72);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}

.practice-card h3{font-size:20px;margin-bottom:8px}
.practice-card p{font-size:14px;line-height:1.8;color:rgba(255,255,255,.82)}
.practice-card .wide-action{width:100%;min-height:48px;margin-top:18px;border:none;border-radius:999px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(215,244,248,.94));color:#245568;font:600 15px "Noto Sans SC",sans-serif;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 28px rgba(10,40,60,.25);transition:transform .2s,box-shadow .2s}
.practice-card .wide-action:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(10,40,60,.32)}
.practice-card .practice-note{font-size:12px;color:rgba(255,255,255,.58);margin-top:10px}
.note-paper{position:relative;width:min(720px,calc(100vw - 28px));max-height:82vh;overflow-y:auto;background:linear-gradient(180deg,#fffef8,#fbf1c9);border:1px solid rgba(190,160,100,.24);border-radius:14px;padding:62px 58px 48px;box-shadow:0 24px 70px rgba(70,50,20,.28),inset 0 0 90px rgba(255,240,180,.36);transform:rotateX(-12deg) rotateY(-4deg) rotate(-.5deg);transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.8,.3,1);box-sizing:border-box;scrollbar-width:thin}
.note-paper::-webkit-scrollbar{width:5px}
.note-paper::-webkit-scrollbar-thumb{background:rgba(170,140,85,.35);border-radius:999px}
.note-context{font-size:12px;color:#aa8753;letter-spacing:2px;margin-bottom:14px;text-align:center}
.note-content{font-size:18px;line-height:2;color:#4a3a20;font-family:"Noto Serif SC","ZCOOL KuaiLe",serif;text-align:left;opacity:0;transition:opacity .6s ease .3s;word-break:break-word;white-space:normal}
.note-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:12px;color:#7a6a4a;letter-spacing:3px;white-space:nowrap;animation:hintPulse 2s ease-in-out infinite}
.note-close{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;border:1px solid rgba(160,130,80,.2);background:rgba(255,255,255,.56);color:#8a6a30;font-size:18px;cursor:pointer;z-index:7}
.bottle-read-mask{position:fixed;inset:0;z-index:86;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:rgba(28,52,66,.42);backdrop-filter:blur(12px);animation:fu .25s}
.bottle-read-card{position:relative;width:min(720px,calc(100vw - 28px));display:grid;grid-template-columns:154px minmax(0,1fr);align-items:center;gap:24px;padding:30px 34px 30px 28px;border-radius:22px;border:1px solid rgba(230,245,250,.72);background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(232,248,250,.92));box-shadow:0 24px 70px rgba(30,65,85,.28);box-sizing:border-box}
.bottle-read-visual{display:flex;align-items:center;justify-content:center;min-height:150px;border-radius:18px;background:linear-gradient(160deg,rgba(126,200,220,.18),rgba(126,200,220,.05));border:1px solid rgba(126,192,208,.2)}

.bottle-read-copy{min-width:0}

.bottle-read-text{font-family:"Noto Serif SC",serif;font-size:17px;line-height:1.9;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:42vh;overflow-y:auto;padding-right:4px}
.bottle-read-actions{display:flex;justify-content:flex-end;margin-top:18px}
.bottle-read-close{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1px solid rgba(140,180,200,.28);background:rgba(255,255,255,.72);color:var(--ink-dim);font-size:19px;cursor:pointer}

  .note-paper{width:calc(100vw - 20px);max-height:76vh;padding:50px 20px 30px;border-radius:12px;transform:rotateX(-8deg) rotate(-.5deg)}

}
.chat-collapse{position:absolute;top:8px;right:12px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid rgba(180,210,220,.4);color:var(--ink-dim);cursor:pointer;font-size:14px;z-index:5;}

.chat-box{position:relative}

.fish-tip{position:fixed;z-index:22;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:16px;padding:8px 14px;font-size:12px;color:var(--ink-dim);letter-spacing:1px;pointer-events:none;animation:bf 2.5s ease-in-out infinite}

// D3 数据驱动的水波计算：根据五维数值生成水波参数
function getWaveParams(){
  var e=state.emo;
  // 波动幅度：压力+焦虑越大，水波越剧烈
  var amp=(e.stress+e.anxiety)*0.3;
  // 频率：快乐+希望越高，水波越温柔舒缓
  var freq=0.02+(e.joy+e.hope)*0.0003;
  // 衰减：疲惫越高，水波越慢
  var speed=0.02+(100-e.fatigue)*0.0004;
  return {amp:amp,freq:freq,speed:speed};
}
// 在球内绘制数据驱动的水波线
function drawDataWaves(){
  var wp=getWaveParams();
  var b=ball;
  ctx.save();
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r*.92,0,Math.PI*2);
  ctx.clip();
  for(var layer=0;layer<3;layer++){
    var yBase=b.y+b.r*(0.2+layer*0.22);
    var alpha=0.06-layer*0.015;
    if(alpha<=0)break;
    ctx.beginPath();
    for(var x=-b.r;x<=b.r;x+=3){
      var y=yBase+Math.sin(x*wp.freq+t*wp.speed+layer)*wp.amp*(1-layer*.3);
      if(x===-b.r)ctx.moveTo(b.x+x,y);
      else ctx.lineTo(b.x+x,y);
    }
    ctx.strokeStyle=rgba(180,220,240,alpha);
    ctx.lineWidth=1.2;
    ctx.stroke();
  }
  ctx.restore();
}

function getBeijingDate(){var d=new Date();var utc=d.getTime()+d.getTimezoneOffset()*60000;return new Date(utc+8*3600000);}
function recordDailyBalance(){var d=getBeijingDate();var key=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();if(!state.dailyLog[key])state.dailyLog[key]=[];state.dailyLog[key].push({t:Date.now(),bal:state.balance});persist();}
function checkMorningSummary(){
var d=getBeijingDate();var nowKey=d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
var hour=d.getHours();
if(hour>=8&&state.lastSummaryDate!==nowKey){
  var yesterday=new Date(d.getTime()-86400000);
  var yKey=yesterday.getFullYear()+"-"+(yesterday.getMonth()+1)+"-"+yesterday.getDate();
  var log=state.dailyLog[yKey];
  if(log&&log.length>0){
    var avg=Math.round(log.reduce(function(a,b){return a+b.bal;},0)/log.length);
    var summary=buildSummaryText(avg,yKey);
    state.lastSummaryDate=nowKey;persist();
    setTimeout(function(){showMorningBubble(summary);},3000);
  } else {
    state.lastSummaryDate=nowKey;persist();
  }
}
}
function buildSummaryText(avg,dateStr){
var parts=dateStr.split("-");var label=(parseInt(parts[1]))+"月"+(parseInt(parts[2]))+"日";
if(avg>=75)return"昨天的"+label+"，这颗球一直在发光。平均平衡"+avg+"分，像春天的湖面。";
if(avg>=60)return"昨天的"+label+"，球里的水刚刚好。平均平衡"+avg+"分，鱼游得很自在。";
if(avg>=45)return"昨天的"+label+"，水有点晃。平均平衡"+avg+"分，不过你一直在。";
if(avg>=30)return"昨天的"+label+"，球里比较沉。平均平衡"+avg+"分，辛苦你了。";
return"昨天的"+label+"，水很暗。平均平衡"+avg+"分，但你还在，这就够了。";
}

function analyzeInput(t){
var delta={joy:0,stress:0,anxiety:0,fatigue:0,hope:0},orb="映";
var neg=/不开心|难过|伤心|悲伤|失落|沮丧|郁闷|心烦|烦躁|难受|痛苦|绝望|孤独|寂寞|委屈|想哭|崩溃|压力大|好累|疲惫|焦虑|紧张|心慌|害怕|恐惧|不安|失眠|emo|丧|抑郁|分手|失恋|失败|被骂|批评|吵架|离职|失业|生病|疼|emo|低落|心情差|心情不好|很烦|郁闷|焦虑|内耗|空虚|麻木|窒息/;
var pos=/开心|高兴|快乐|幸福|愉快|喜欢|美好|感动|棒|太好了|成功|满足|期待|希望|治愈|温暖|放松|休息|完成|顺利|棒极了|开心极了|太棒了|开心呀|嘿嘿|哈哈|笑/;
var conf=/迷茫|怎么办|不知道|未来|方向|意义|选择|纠结|犹豫|不确定|为什么|人生|出路|适合|喜欢什么/;
var str=/工作|学习|考试|加班|ddl|deadline|任务|忙|赶|催|汇报|会议|通勤|上班|上学|卷|kpi|deadline/;
var tired=/累|困|没力气|不想动|精疲力尽|疲惫|乏力|耗竭/;
var isNeg=neg.test(t);
var isPos=pos.test(t)&&!isNeg;
if(isNeg){delta.stress+=8;delta.anxiety+=6;delta.joy-=8;delta.hope-=3;orb="愈";}
if(tired.test(t)){delta.fatigue+=10;delta.joy-=4;if(orb==="映")orb="愈";}
if(isPos){delta.joy+=10;delta.hope+=5;delta.stress-=3;orb="生";}
if(conf.test(t)){delta.anxiety+=5;orb="望";}
if(str.test(t)){delta.stress+=8;delta.fatigue+=3;if(orb==="映")orb="愈";}
if(orb==="映"&&t.length>2)orb="映";
return {delta:delta,orb:orb};
}

// ===== 情绪鱼饵系统 =====
var baits=[];
var BAIT_TYPES={
  joy:{shape:"star",color:[255,220,100],label:"快乐"},
  hope:{shape:"moon",color:[200,180,255],label:"希望"},
  stress:{shape:"thunder",color:[180,180,200],label:"压力"},
  anxiety:{shape:"swirl",color:[160,140,200],label:"焦虑"},
  fatigue:{shape:"cloud",color:[180,200,210],label:"疲惫"},
  heal:{shape:"heart",color:[255,150,150],label:"治愈"},
  warm:{shape:"flower",color:[255,180,200],label:"温暖"}
};
function spawnBait(emotionType){
  var bt=BAIT_TYPES[emotionType]||BAIT_TYPES.warm;
  var bx=(Math.random()-.5)*ball.r*1.2;
  var by=(Math.random()-.5)*ball.r*0.6;
  baits.push({
    dx:bx,dy:by,dz:(Math.random()-.5)*60,
    shape:bt.shape,color:bt.color,
    life:1,alpha:0,scale:0,
    phase:Math.random()*Math.PI*2,
    eaten:false
  });
}
function drawBaits(){
  for(var i=baits.length-1;i>=0;i--){
    var b=baits[i];
    b.alpha=Math.min(1,b.alpha+0.03);
    b.scale=Math.min(1,b.scale+0.05);
    b.life-=0.002;
    if(b.life<=0||b.eaten){
      b.alpha-=0.08;
      if(b.alpha<=0){baits.splice(i,1);continue;}
    }
    b.phase+=0.03;
    var p=proj(b.dx,b.dy+Math.sin(b.phase)*8,b.dz);
    var sc=b.scale*p.scale;
    ctx.save();
    ctx.globalAlpha=b.alpha;
    ctx.translate(p.sx,p.sy);
    ctx.scale(sc,sc);
    var c=b.color;
    // 光晕
    var bg=ctx.createRadialGradient(0,0,0,0,0,30);
    bg.addColorStop(0,rgba(c[0],c[1],c[2],.3));
    bg.addColorStop(1,rgba(c[0],c[1],c[2],0));
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,0,30,0,Math.PI*2);ctx.fill();
    // 绘制形状
    ctx.fillStyle=rgba(c[0],c[1],c[2],.9);
    ctx.strokeStyle=rgba(255,255,255,.5);
    ctx.lineWidth=1.5;
    if(b.shape==="star"){
      ctx.beginPath();
      for(var k=0;k<5;k++){
        var a=-Math.PI/2+k*Math.PI*2/5;
        var r1=14,r2=6;
        var x1=Math.cos(a)*r1,y1=Math.sin(a)*r1;
        var a2=a+Math.PI/5;
        var x2=Math.cos(a2)*r2,y2=Math.sin(a2)*r2;
        if(k===0)ctx.moveTo(x1,y1);else ctx.lineTo(x1,y1);
        ctx.lineTo(x2,y2);
      }
      ctx.closePath();ctx.fill();ctx.stroke();
    } else if(b.shape==="moon"){
      ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();
      ctx.globalCompositeOperation="destination-out";
      ctx.beginPath();ctx.arc(5,-3,10,0,Math.PI*2);ctx.fill();
      ctx.globalCompositeOperation="source-over";
      ctx.strokeStyle=rgba(c[0],c[1],c[2],.6);
      ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.stroke();
    } else if(b.shape==="cloud"){
      ctx.beginPath();
      ctx.arc(-8,2,7,0,Math.PI*2);
      ctx.arc(0,-3,9,0,Math.PI*2);
      ctx.arc(9,2,7,0,Math.PI*2);
      ctx.fill();
    } else if(b.shape==="heart"){
      ctx.beginPath();
      ctx.moveTo(0,5);
      ctx.bezierCurveTo(-12,-5,-8,-14,0,-7);
      ctx.bezierCurveTo(8,-14,12,-5,0,5);
      ctx.fill();
    } else if(b.shape==="swirl"){
      ctx.beginPath();
      for(var a=0;a<Math.PI*4;a+=0.2){
        var r=a*1.8;
        var x=Math.cos(a)*r,y=Math.sin(a)*r;
        if(a===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();ctx.lineWidth=2;
    } else if(b.shape==="thunder"){
      ctx.beginPath();
      ctx.moveTo(2,-14);ctx.lineTo(-6,2);ctx.lineTo(0,2);
      ctx.lineTo(-2,14);ctx.lineTo(8,-2);ctx.lineTo(1,-2);
      ctx.closePath();ctx.fill();
    } else if(b.shape==="flower"){
      for(var p=0;p<6;p++){
        var pa=p*Math.PI/3;
        ctx.beginPath();
        ctx.arc(Math.cos(pa)*7,Math.sin(pa)*7,6,0,Math.PI*2);
        ctx.fill();
      }
      ctx.fillStyle=rgba(255,240,150,.9);
      ctx.beginPath();ctx.arc(0,0,4,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
    // 鱼吃到鱼饵
    var fdx=fish.x-p.sx,fdy=fish.y-p.sy;
    var fd=Math.sqrt(fdx*fdx+fdy*fdy);
    if(fd<30&&!b.eaten&&b.alpha>.5){
      b.eaten=true;
      fishBounce=1;
    }
  }
}

function updateBeijingClock(){
  var d=new Date();
  var utc=d.getTime()+d.getTimezoneOffset()*60000;
  var bj=new Date(utc+8*3600000);
  var h=bj.getHours(),m=bj.getMinutes(),sec=bj.getSeconds();
  var hh=h<10?"0"+h:h,mm=m<10?"0"+m:m,ss=sec<10?"0"+sec:sec;
  var week=["日","一","二","三","四","五","六"][bj.getDay()];
  var el=document.getElementById("beijingClock");
  if(el)el.textContent=bj.getMonth()+1+"月"+bj.getDate()+"日 周"+week+" "+hh+":"+mm+":"+ss;
}
setInterval(updateBeijingClock,1000);
